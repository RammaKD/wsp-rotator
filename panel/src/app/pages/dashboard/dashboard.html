<div class="dashboard-container">
  <header>
    <div>
      <h2>Rotador de WhatsApp</h2>
      <p class="subtitle">Panel de administración</p>
    </div>
    <button class="btn-secundario" (click)="logout()">Cerrar sesión</button>
  </header>

  <section class="card agregar">
    <h3>Agregar número</h3>
    <div class="form-row">
      <input
        type="text"
        placeholder="Nombre (ej: Juan)"
        [(ngModel)]="nuevoNombre"
        [disabled]="cargando()"
      />
      <input
        type="text"
        placeholder="Número sin 54 ni 9 (ej: 1136473783)"
        [(ngModel)]="nuevoNumero"
        [disabled]="cargando()"
      />
      <button class="btn-primario" (click)="agregarNumero()" [disabled]="cargando()">
        <span *ngIf="cargando()" class="spinner"></span>
        {{ cargando() ? 'Guardando...' : 'Agregar' }}
      </button>
    </div>
    <p class="error" *ngIf="errorMsg()">{{ errorMsg() }}</p>
  </section>

  <section class="card">
    <h3>Números en rotación</h3>

    <div class="loading-overlay" *ngIf="cargando() && numeros().length === 0">
      <span class="spinner grande"></span>
      <p>Cargando...</p>
    </div>

    <div class="tabla-wrapper" *ngIf="numeros().length > 0">
      <table>
        <thead>
          <tr>
            <th>Orden</th>
            <th>Nombre</th>
            <th>Número</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let numero of numeros()">
            <td data-label="Orden">{{ numero.orden }}</td>
            <td data-label="Nombre">{{ numero.nombre || '-' }}</td>
            <td data-label="Número">{{ numero.numero }}</td>
            <td data-label="Estado">
              <span class="badge" [class.activo]="numero.activo" [class.pausado]="!numero.activo">
                {{ numero.activo ? 'Activo' : 'Pausado' }}
              </span>
            </td>
            <td data-label="Acciones" class="acciones">
              <button class="btn-toggle" (click)="toggleActivo(numero)" [disabled]="cargando()">
                {{ numero.activo ? 'Pausar' : 'Activar' }}
              </button>
              <button class="btn-eliminar" (click)="eliminarNumero(numero.id)" [disabled]="cargando()">
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="vacio" *ngIf="numeros().length === 0 && !cargando()">
      No hay números cargados todavía.
    </p>
  </section>
</div>
