<div class="login-container">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <div class="brand-login">
      <img src="/assets/logo.png" alt="Logo Rotador de Whatsapp" class="brand-login-logo" />
    </div>
    <h2>Panel de administración</h2>
    <p class="subtitle">Rotador de Whatsapp</p>

    <div class="campo">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        [disabled]="cargando()"
      />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        [disabled]="cargando()"
      />
    </div>

    <p class="error" *ngIf="errorMsg()">{{ errorMsg() }}</p>

    <button type="submit" [disabled]="cargando()">
      <span *ngIf="cargando()" class="spinner"></span>
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
